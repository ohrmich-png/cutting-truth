name: headlines
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch world headlines from wire RSS feeds
        run: |
          python3 - << 'EOF'
          import json, re, urllib.request, datetime, time
          import xml.etree.ElementTree as ET
          FEEDS = [
              "http://feeds.bbci.co.uk/news/world/rss.xml",
              "https://www.aljazeera.com/xml/rss/all.xml",
              "https://www.france24.com/en/rss",
              "https://rss.dw.com/rdf/rss-en-all",
          ]
          SOFT = re.compile(r"\b(quiz|recipe|horoscope|fashion|travel guide|gift guide)\b", re.I)
          items = []
          for url in FEEDS:
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "cutting-truth-ticker/1.0"})
                  data = urllib.request.urlopen(req, timeout=40).read()
                  root = ET.fromstring(data)
                  for it in root.iter("item"):
                      t = (it.findtext("title") or "").strip()
                      u = (it.findtext("link") or "").strip()
                      if not t or not u or "?" in t or SOFT.search(t):
                          continue
                      pub = (it.findtext("pubDate") or "")
                      items.append({"t": t, "u": u, "s": url.split("/")[2], "d": pub[:16]})
                  print(url.split("/")[2], "ok")
                  time.sleep(2)
              except Exception as e:
                  print(url.split("/")[2], "failed:", e)
          seen, arts = set(), []
          for a in items:
              if a["t"] not in seen:
                  seen.add(a["t"])
                  arts.append(a)
              if len(arts) >= 40:
                  break
          if arts:
              out = {"updated": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                     "headlines": arts}
              json.dump(out, open("headlines.json", "w"), ensure_ascii=False)
              print(len(arts), "headlines saved")
          else:
              print("no headlines fetched; keeping previous file")
          EOF
      - name: Commit headlines
        run: |
          git config user.name "scarlett"
          git config user.email "scarlett@local"
          git add headlines.json
          git diff --cached --quiet || (git commit -m "headlines refresh" && git push)
